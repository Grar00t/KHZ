name: KHZ Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - sprint/**

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore .\KHZ.slnx

      - name: Build
        run: dotnet build .\KHZ.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\KHZ.slnx --configuration Release --no-build --verbosity normal
